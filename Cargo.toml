[package]
name = "synchub"
version = "0.1.0"
license = "MIT"
edition = "2024"
description = "Syncthing helpers: move a synced directory, push a directory into a share, ignore what git ignores"
repository = "https://github.com/axos88/synchub"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
derive_more = { version = "2.1.1", features = ["display", "error"] }
gix = { version = "0.90.0", default-features = false, features = ["dirwalk", "sha1"] }
itertools = "0.14.0"
once_cell = "1.21.4"
rand = "0.10.3"
ring = "0.17.14"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
roxmltree = "0.21.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
